name: Publish approved breakroom events

on:
  repository_dispatch:
    types: [rmj_calendar_update]

permissions:
  contents: write

concurrency:
  group: rmj-calendar-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate and publish approved event data
        env:
          EVENT_FILE: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import json, os, datetime, pathlib
          with open(os.environ['EVENT_FILE'], encoding='utf-8') as f:
              hook = json.load(f)
          payload = hook.get('client_payload') or {}
          if isinstance(payload, str):
              payload = json.loads(payload)
          events = payload.get('events')
          if isinstance(events, str):
              events = json.loads(events)
          if not isinstance(events, list):
              raise ValueError('Expected client_payload.events to be an array')
          if len(events) > 500:
              raise ValueError('Too many events; check Microsoft Graph paging and filtering')
          safe = []
          for ev in events:
              if not isinstance(ev, dict):
                  continue
              title = ev.get('title')
              start = ev.get('start')
              end = ev.get('end')
              all_day = ev.get('isAllDay')
              if not isinstance(title, str) or not 0 < len(title.strip()) <= 160:
                  continue
              if not isinstance(start, str) or not isinstance(end, str):
                  continue
              try:
                  s = datetime.datetime.fromisoformat(start.replace('Z', '+00:00'))
                  e = datetime.datetime.fromisoformat(end.replace('Z', '+00:00'))
                  if s.tzinfo is None or e.tzinfo is None or e <= s:
                      continue
              except ValueError:
                  continue
              if not isinstance(all_day, bool):
                  continue
              # Only these four approved fields are written. Never publish Outlook bodies,
              # attendees, notes, meeting links, or other Graph response metadata.
              safe.append({'title': title.strip(), 'start': start,
                           'end': end, 'isAllDay': all_day})
          safe.sort(key=lambda ev: ev['start'])
          output = {'events': safe,
                    'updatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('calendar.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Prepared', len(safe), 'approved calendar events')
          PY

      - name: Commit the calendar if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          if git diff --staged --quiet; then
            echo 'No calendar changes.'
          else
            git commit -m "Update approved breakroom calendar"
            git push
          fi
