name: Publish RMJ slideshow and lookahead
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'icalendar>=6,<8' 'recurring-ical-events>=3,<4'
      - run: |
          mkdir -p site
          cp index.html logo.png site/
      - name: Retrieve and prepare schedule
        env:
          RMJ_LOOKAHEAD_KEY: ${{ secrets.RMJ_LOOKAHEAD_KEY }}
          PUBLISH_LOOKAHEAD: ${{ vars.PUBLISH_LOOKAHEAD }}
          PUBLISH_TITLES: ${{ vars.PUBLISH_TITLES }}
        run: python sync_lookahead.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
