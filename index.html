<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0c0d">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>RMJ Consulting | Operations Calendar</title>
  <style>
    :root{--navy:#0c0c0d;--navy-deep:#050505;--teal:#c7a35a;--teal-light:#fff2d6;--ink:#f6f0e5;--muted:#a7a092;--line:#403729;--paper:#08090b;--white:#161719;--shadow:0 18px 55px rgba(0,0,0,.37)}
    *{box-sizing:border-box;cursor:none!important}
    html,body{margin:0;width:100%;height:100%;font-family:Arial,"Helvetica Neue",sans-serif;background:var(--paper);color:var(--ink);overflow:hidden}
    .shell{height:100vh;min-height:520px;display:flex;flex-direction:column}
    .topbar{background:linear-gradient(110deg,#080808,#171717 65%,#221b10);color:#fff;min-height:112px;padding:20px 3vw;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:3px solid #c7a35a}
    .brand{display:flex;align-items:center;gap:20px;min-width:0}
    .logo{display:none;max-width:270px;max-height:75px;object-fit:contain;background:transparent;padding:0;border-radius:0}
    .fallback{font-weight:900;letter-spacing:-1.8px;font-size:clamp(29px,3.25vw,55px);line-height:1;color:white;white-space:nowrap}
    .fallback em{font-style:normal;color:#d4b36e}
    .brand-rule{height:49px;width:2px;background:rgba(255,255,255,.25)}
    .brand-copy .eyebrow{color:#d6b675;font-size:clamp(11px,.85vw,16px);font-weight:800;letter-spacing:3px;text-transform:uppercase}
    .brand-copy .tagline{color:#c9bead;font-size:clamp(12px,1vw,18px);margin-top:7px;white-space:nowrap}
    .clock{text-align:right;white-space:nowrap}
    #clock{font-size:clamp(26px,2.3vw,43px);font-weight:800;letter-spacing:-.8px}
    #today{font-size:clamp(12px,1vw,18px);color:#dfcda8;margin-top:5px}
    main{padding:22px 2.8vw 12px;flex:1;display:flex;flex-direction:column;min-height:0;gap:15px}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;flex-shrink:0}
    .section-head h1{font-size:clamp(22px,2.25vw,42px);letter-spacing:-1px;margin:0;color:#f5e9d3}
    .section-head .sub{color:var(--muted);font-size:clamp(11px,1vw,17px);margin-top:4px}
    .status{font-size:clamp(10px,.85vw,15px);color:#a99a7f;display:flex;align-items:center;gap:8px;white-space:nowrap;padding-bottom:6px}
    .dot{width:9px;height:9px;border-radius:50%;background:#d3ad61;flex:none}
    .dot.wait{background:#986d26}
    .weeks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;flex:1;min-height:0}
    .week{background:var(--white);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
    .week-top{background:linear-gradient(110deg,#211c13 0%,#3b301e 100%);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:15px 20px;flex:none;gap:10px}
    .week-next .week-top{background:linear-gradient(110deg,#181717,#372a16)}
    .week-name{font-size:clamp(16px,1.45vw,26px);font-weight:800;letter-spacing:.2px}
    .week-range{font-size:clamp(12px,1.08vw,19px);font-weight:700;color:#e4ce9e;white-space:nowrap}
    .day-grid{display:grid;grid-template-rows:repeat(7,minmax(0,1fr));flex:1;min-height:0}
    .day{display:grid;grid-template-columns:105px minmax(0,1fr);gap:12px;align-items:center;padding:7px 16px;border-bottom:1px solid var(--line);min-height:0;overflow:hidden}
    .day:last-child{border-bottom:0}
    .day.today{background:#2b2418;box-shadow:inset 4px 0 0 var(--teal)}
    .day.weekend{background:#1b1b1c}
    .day.today.weekend{background:#2b2418}
    .date{display:flex;align-items:center;gap:9px;white-space:nowrap}
    .num{font-size:clamp(22px,2vw,37px);font-weight:800;color:var(--navy);line-height:1}
    .day.today .num{color:var(--teal)}
    .dow{font-size:clamp(10px,.78vw,14px);font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:#aa9d85}
    .events{display:flex;flex-direction:column;gap:5px;min-width:0;overflow:hidden;max-height:100%}
    .event{display:flex;align-items:baseline;gap:9px;border-left:3px solid var(--teal);background:#29251d;padding:6px 10px;font-size:clamp(11px,.98vw,18px);line-height:1.2;border-radius:0 5px 5px 0;min-width:0}
    .event .at{flex:none;color:#dfba72;font-size:clamp(9px,.75vw,14px);font-weight:800;white-space:nowrap}
    .event .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .more{color:#c2ab79;font-size:clamp(10px,.8vw,14px);padding-left:6px;font-weight:700}
    .empty{font-size:clamp(11px,.9vw,15px);color:#746d61;letter-spacing:.2px}
    footer{flex:none;min-height:38px;background:#101112;color:#b3a48c;padding:10px 3vw;display:flex;justify-content:space-between;align-items:center;font-size:clamp(10px,.8vw,14px);border-top:1px solid #483b26}
    .foot-strong{font-weight:800;color:#d7b46e;letter-spacing:.8px}
    @media(max-width:1050px){.topbar{min-height:92px;padding:15px 2vw}.rmj-mark{width:220px}.brand{gap:12px}.brand-rule{height:36px}.day{grid-template-columns:65px minmax(0,1fr);padding:5px 9px;gap:6px}.date{gap:5px}.event{padding:5px 6px;gap:5px}.weeks{gap:9px}main{padding:12px 1.5vw 7px;gap:8px}}
    @media(max-height:720px){.topbar{min-height:78px;padding-top:10px;padding-bottom:10px}.section-head h1{font-size:26px}.week-top{padding:9px 14px}.day{padding-top:3px;padding-bottom:3px}.event{padding-top:3px;padding-bottom:3px}footer{min-height:26px;padding:5px 2vw}}
    @media(max-width:690px){html,body{overflow:auto}.shell{height:auto;min-height:100vh}.topbar{gap:8px}.brand-copy .tagline{display:none}.brand-rule{display:none}.weeks{grid-template-columns:1fr}.week{min-height:620px}.clock #today{font-size:10px}.status{display:none}.day{grid-template-columns:85px 1fr}}
  
    .rmj-mark{width:clamp(220px,23vw,365px);height:auto;max-height:82px;display:block;flex-shrink:0}
    /* RMJ black + gold visual refresh. All calendar logic remains unchanged. */
    body{background:radial-gradient(ellipse at 87% -20%,#282015 0%,transparent 48%),#08090b}
    .topbar{box-shadow:0 10px 30px rgba(0,0,0,.25)}
    .brand-copy .eyebrow{letter-spacing:3.4px}
    .week{border-color:#4d3e28;box-shadow:0 22px 46px rgba(0,0,0,.22)}
    .week-top{border-bottom:1px solid #78613c}
    .week-name{letter-spacing:1.2px}
    .day.today{box-shadow:inset 5px 0 0 #e2ba6e;background:#30271a}
    .day.weekend{background:#191919}
    .day.today.weekend{background:#30271a}
    .event{border-left-color:#d0a85d;border-radius:0 6px 6px 0}
    .num{color:#f3e2c0}
    .day.today .num{color:#f3c46b}
    .foot-strong{color:#e4be75}
    .section-head .sub{color:#b8a88f}
    .section-head h1{color:#f5ead4}
    #clock{font-variant-numeric:tabular-nums}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <svg class="rmj-mark" viewBox="0 0 365 100" role="img" aria-label="RMJ Consulting" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b9"/><stop offset=".48" stop-color="#d8ae5b"/><stop offset="1" stop-color="#a47730"/></linearGradient></defs>
  <path d="M4 14h6v72H4z" fill="url(#gold)"/>
  <text x="23" y="69" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="69" letter-spacing="-5" fill="url(#gold)">RMJ</text>
  <path d="M25 77H203" stroke="#bc8e43" stroke-width="2"/>
  <text x="224" y="43" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" letter-spacing="1.2" fill="#f7e7c6">CONSULTING</text>
  <text x="225" y="64" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="10.5" letter-spacing="2.7" fill="#c6a66d">AUTOMATION</text>
</svg>
      <div class="brand-rule"></div>
      <div class="brand-copy"><div class="eyebrow">Operations</div><div class="tagline">Engineering • Automation • Integration</div></div>
    </div>
    <div class="clock"><div id="clock">--:--</div><div id="today">Loading date…</div></div>
  </header>
  <main>
    <div class="section-head">
      <div><h1>Two-Week Operations Calendar</h1><div class="sub">This week + next week • Monday–Sunday • Eastern Time</div></div>
      <div class="status"><span id="statusDot" class="dot wait"></span><span id="statusText">Loading calendar…</span></div>
    </div>
    <div class="weeks">
      <section class="week"><div class="week-top"><div class="week-name">THIS WEEK</div><div id="range0" class="week-range">—</div></div><div id="days0" class="day-grid"></div></section>
      <section class="week week-next"><div class="week-top"><div class="week-name">NEXT WEEK</div><div id="range1" class="week-range">—</div></div><div id="days1" class="day-grid"></div></section>
    </div>
  </main>
  <footer><span class="foot-strong">RMJ CONSULTING LLC <span style="color:#66543a">/</span> TEAM OPERATIONS</span><span id="footStatus">Outlook operations calendar • Automatic updates</span></footer>
</div>
<script>
(function(){
  'use strict';
  var TZ='America/New_York';
  var EVENTS=[];
  var lastUpdated=null;
  var lastWeek='';
  var hasLoaded=false;
  var FORMAT_DAY=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
  var FORMAT_TIME=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit',hour12:true});
  function parts(d){var p=FORMAT_DAY.formatToParts(d),v={};for(var i=0;i<p.length;i++)v[p[i].type]=p[i].value;return v;}
  function dayKey(d){var p=parts(d);return p.year+'-'+p.month+'-'+p.day}
  function dateOfKey(k){return new Date(k+'T12:00:00Z')}
  function addDays(k,n){var d=dateOfKey(k);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
  function weekStart(k){var d=dateOfKey(k),wd=d.getUTCDay();return addDays(k,-((wd+6)%7))}
  function label(k){return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',timeZone:'UTC'}).format(dateOfKey(k))}
  function spanText(start,end){var a=dateOfKey(start),b=dateOfKey(end);var sa=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:'UTC'}).format(a);var sb=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:'UTC'}).format(b);return sa===sb?sa+' '+a.getUTCDate()+'–'+b.getUTCDate():sa+' '+a.getUTCDate()+' – '+sb+' '+b.getUTCDate()}
  function node(tag,cls,content){var e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e;}
  function eventForDay(ev,k){
    var s=Date.parse(ev.start),e=Date.parse(ev.end);
    if(!Number.isFinite(s)||!Number.isFinite(e)||e<=s)return false;
    // All-day end is exclusive in Microsoft Graph; dayKey uses the requested Eastern time zone.
    var dayStart=Date.parse(k+'T00:00:00Z');
    if(ev.isAllDay){var startDay=ev.start.slice(0,10),endDay=ev.end.slice(0,10);return k>=startDay&&k<endDay;}
    // Compare local calendar dates without assuming Eastern midnight is UTC midnight.
    var first=dayKey(new Date(s)),last=dayKey(new Date(e-1));return k>=first&&k<=last;
  }
  function render(){
    var today=dayKey(new Date()),start=weekStart(today);
    lastWeek=start;
    var days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
    for(var w=0;w<2;w++){
      var first=addDays(start,w*7),last=addDays(first,6);
      document.getElementById('range'+w).textContent=spanText(first,last);
      var grid=document.getElementById('days'+w);grid.replaceChildren();
      for(var i=0;i<7;i++){
        var k=addDays(first,i),d=dateOfKey(k),dow=days[d.getUTCDay()];
        var day=node('div','day'+(k===today?' today':'')+((i===5||i===6)?' weekend':''));
        var date=node('div','date');date.appendChild(node('span','num',String(d.getUTCDate()).padStart(2,'0')));date.appendChild(node('span','dow',dow));day.appendChild(date);
        var wrap=node('div','events');
        var matched=EVENTS.filter(function(e){return eventForDay(e,k)}).sort(function(a,b){return Date.parse(a.start)-Date.parse(b.start)});
        if(matched.length===0)wrap.appendChild(node('div','empty','No scheduled events'));
        matched.slice(0,3).forEach(function(e){var item=node('div','event');var time=e.isAllDay?'ALL DAY':FORMAT_TIME.format(new Date(e.start));item.appendChild(node('span','at',time));item.appendChild(node('span','name',e.title));wrap.appendChild(item)});
        if(matched.length>3)wrap.appendChild(node('div','more','+'+(matched.length-3)+' more scheduled'));
        day.appendChild(wrap);grid.appendChild(day);
      }
    }
  }
  function tick(){
    var now=new Date();
    document.getElementById('clock').textContent=FORMAT_TIME.format(now);
    document.getElementById('today').textContent=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(now);
    if(dayKey(now) && weekStart(dayKey(now))!==lastWeek)render();
  }
  function load(){
    fetch('calendar.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(data){
      if(!data||!Array.isArray(data.events))throw Error('Invalid calendar format');
      EVENTS=data.events.filter(function(e){return e && typeof e.title==='string' && e.title.length>0 && typeof e.start==='string' && typeof e.end==='string'});
      hasLoaded=true;lastUpdated=new Date();render();
      document.getElementById('statusDot').className='dot';
      document.getElementById('statusText').textContent='Calendar updated '+FORMAT_TIME.format(lastUpdated);
      document.getElementById('footStatus').textContent='Operations calendar • Updates automatically';
    }).catch(function(err){
      document.getElementById('statusDot').className='dot wait';
      document.getElementById('statusText').textContent=hasLoaded?'Update delayed • showing last data':'Waiting for calendar data';
      console.warn('Calendar unavailable',err);
    });
  }
  tick();render();load();
  setInterval(tick,20000);
  setInterval(load,60000);
  // Refresh occasionally so long-running Samsung browsers pick up changes to the website itself.
  setTimeout(function(){location.reload()},6*60*60*1000);
})();
</script>
</body>
</html>
